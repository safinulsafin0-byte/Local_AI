<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS AI</title>


<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">


<link rel="stylesheet" href="/style.css">


<!-- THREE JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<!-- MEDIAPIPE -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


</head>


<body>


<div class="app">



<header class="topbar">


<div class="brand">


<div class="brand-mark">
J
</div>


<div>

<div class="brand-name">
JARVIS
</div>


<div class="brand-subtitle">
AI COMMAND CENTER
</div>


</div>


</div>




<div class="command-status" id="commandStatus">

<span class="command-status-dot"></span>

<span>
System Ready
</span>

</div>


</header>





<div class="main-row">





<section class="chat-panel">


<div class="chat-shell">


<section class="chat-section" id="chat">


<div class="welcome-message" id="welcome">


<div class="welcome-icon">
J
</div>


<h1>
Hello, I'm JARVIS
</h1>


<p>
Give me a command and I will execute it.
</p>


</div>


</section>


</div>





<div class="input-area">


<div id="attachment-preview"
class="attachment-preview"
style="display:none;">
</div>



<div class="input-container">



<textarea

id="messageInput"

placeholder="Give JARVIS a command..."

rows="1">

</textarea>





<input

type="file"

id="attachment-input"

hidden>





<button

class="attachment-button"

id="attachment-btn"

type="button">

📎

</button>





<button

class="send-button"

id="sendButton"

type="button">

➤

</button>


</div>


</div>



</section>









<aside class="office-panel">


<div class="stage">


<canvas

id="officeCanvas"

width="960"

height="480">

</canvas>





<div

id="hologramMenu"

class="hologram-menu">


<h2>
JARVIS HOLOGRAM CONTROL
</h2>



<button id="particleModeBtn">
PARTICLE ENGINE
</button>



<button id="drawModeBtn">
3D DRAW SPACE
</button>



<button id="modelModeBtn">
3D MODELS
</button>



<button id="fileModeBtn">
FILE SYSTEM
</button>



<button id="voiceModeBtn">
VOICE CONTROL
</button>



<button id="systemModeBtn">
SYSTEM STATUS
</button>



<button id="closeMenuBtn">
CLOSE
</button>



</div>






<div class="activity-chip">


<div class="label">
SYSTEM ACTIVITY
</div>


<div

class="text"

id="activityText">

Waiting...

</div>


</div>






<div class="orb-widget">


<div class="orb-canvas-wrap">

<canvas

id="orbCanvas"

width="120"

height="120">

</canvas>

</div>




<div id="orbLabel">

SYSTEM ACTIVE

</div>



<div id="orbSub">

idle

</div>





<div class="orb-controls">


<button

class="orb-btn mic"

id="micButton">

MIC

</button>



<button

class="orb-btn stop"

id="stopButton">

STOP

</button>



<button

class="orb-btn gesture"

id="gestureButton">

GESTURE

</button>



</div>



</div>





</div>


</aside>





</div>







<video

id="gestureCamera"

autoplay

muted

playsinline

style="display:none">

</video>







<!-- ========================= -->
<!-- JARVIS CORE -->
<!-- ========================= -->


<script src="/web/gesture/commands.js"></script>


<script src="/web/gesture/hand_tracker.js"></script>


<script src="/web/gesture/gesture_engine.js"></script>



<script src="/web/3d_engine.js"></script>



<script src="/web/hologram_engine.js"></script>



<script src="/app.js"></script>





<script src="/web/ai/ai_state.js"></script>


<script src="/web/ai/command_schema.js"></script>


<script src="/web/ai/action_router.js"></script>


<script src="/web/ai/jarvis_brain.js"></script>






<script>

window.addEventListener("load",()=>{


console.log(
"JARVIS ALL SYSTEMS LOADED"
);


console.log(
"Brain:",
typeof window.jarvisThink
);


console.log(
"Router:",
typeof window.executeAIAction
);


console.log(
"Hologram:",
typeof window.openHologramWorkspace
);


console.log(
"3D:",
typeof window.create3DObject
);


console.log(
"THREE:",
typeof THREE
);


});


</script>



</body>

</html>
