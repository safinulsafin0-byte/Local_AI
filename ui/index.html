<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Local AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
    /* signal console palette */
    --bg:#0a0d10;
    --bg-glow: radial-gradient(1200px 600px at 50% -10%, rgba(94,234,212,.06), transparent 60%);
    --panel:#0e1316;
    --panel2:#141a1e;
    --border:#20272c;
    --border-soft:#1a2125;
    --text:#eef2f3;
    --muted:#8a959c;
    --muted-dim:#5c6870;
    --hover:#161d21;
    --accent:#5eead4;
    --accent-soft:rgba(94,234,212,.14);
    --accent-glow:rgba(94,234,212,.35);
    --amber:#f2b155;
    --danger:#f0616b;
    --user:#161d21;
    --user-border:#242d32;
    --r-lg:18px;
    --r-md:12px;
    --r-sm:8px;
    --f-display:'Space Grotesk',ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --f-body:'Inter',ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    --f-mono:'JetBrains Mono',ui-monospace,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:var(--f-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{background-image:var(--bg-glow);background-repeat:no-repeat}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:transparent}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100vh;display:flex;overflow:hidden}

/* SIDEBAR */
.sidebar{
    width:264px;background:var(--panel);display:flex;flex-direction:column;
    padding:14px 12px;flex-shrink:0;border-right:1px solid var(--border-soft);
}
.brand{
    display:flex;align-items:center;gap:11px;padding:8px 8px 20px;
}
.brand-icon{
    position:relative;
    width:32px;height:32px;border-radius:9px;
    background:linear-gradient(155deg,var(--accent),#2f9885);
    color:#04211c;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;font-weight:700;
    box-shadow:0 0 0 1px rgba(94,234,212,.25),0 4px 14px -4px var(--accent-glow);
}
.brand-icon::after{
    content:"";position:absolute;inset:-7px;border-radius:14px;border:1px solid var(--accent);
    opacity:.3;animation:ring 3s cubic-bezier(.4,0,.2,1) infinite;
}
@keyframes ring{0%{transform:scale(.8);opacity:.45}100%{transform:scale(1.4);opacity:0}}
.brand-text{font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.01em}
.brand-text small{display:block;font-family:var(--f-body);font-size:10.5px;font-weight:500;color:var(--muted-dim);letter-spacing:.09em;text-transform:uppercase;margin-top:1px}

.new-chat{
    width:100%;height:42px;border:1px solid var(--border);border-radius:var(--r-md);
    background:var(--panel2);color:var(--text);display:flex;align-items:center;
    gap:9px;padding:0 13px;cursor:pointer;text-align:left;font-size:13.5px;font-weight:500;
    transition:border-color .15s,background .15s;
}
.new-chat:hover{background:var(--hover);border-color:#2c353b}
.new-chat svg{flex-shrink:0;color:var(--accent)}

.sidebar-label{
    color:var(--muted-dim);font-size:10.5px;font-weight:600;text-transform:uppercase;
    letter-spacing:.09em;padding:20px 10px 8px;
}
.chat-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.chat-item{
    display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:var(--r-sm);
    cursor:pointer;color:#c7ced2;font-size:13px;white-space:nowrap;overflow:hidden;
    border:1px solid transparent;transition:background .12s,border-color .12s;
}
.chat-item:hover{background:var(--hover)}
.chat-item.active{background:var(--accent-soft);border-color:rgba(94,234,212,.22);color:var(--text)}
.chat-item-dot{width:5px;height:5px;border-radius:50%;background:var(--muted-dim);flex-shrink:0}
.chat-item.active .chat-item-dot{background:var(--accent)}
.chat-title{overflow:hidden;text-overflow:ellipsis}

.sidebar-bottom{border-top:1px solid var(--border-soft);padding-top:10px;margin-top:6px}
.status{
    display:flex;align-items:center;gap:9px;padding:9px 10px;color:var(--muted);font-size:12px;
    font-family:var(--f-mono);
}
.dot-wrap{position:relative;width:8px;height:8px;flex-shrink:0}
.dot{position:absolute;inset:0;border-radius:50%;background:#2ee6a6;box-shadow:0 0 8px 1px rgba(46,230,166,.6)}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid #2ee6a6;opacity:.5;animation:pulse-ring 2s ease-out infinite}
.dot.offline{background:var(--danger);box-shadow:0 0 8px 1px rgba(240,97,107,.5)}
.dot.offline::after{border-color:var(--danger)}
@keyframes pulse-ring{0%{transform:scale(.6);opacity:.6}100%{transform:scale(2.2);opacity:0}}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh}
.topbar{
    height:56px;display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;border-bottom:1px solid var(--border-soft);background:rgba(10,13,16,.85);
    backdrop-filter:blur(10px);flex-shrink:0;
}
.model-name{font-family:var(--f-display);font-weight:600;font-size:14.5px;letter-spacing:.01em}
.model-name small{color:var(--muted-dim);font-weight:500;font-size:11.5px;margin-left:7px;font-family:var(--f-body)}
.top-actions{display:flex;gap:6px}
.icon-btn{
    width:36px;height:36px;border-radius:var(--r-sm);background:transparent;color:var(--muted);
    cursor:pointer;display:grid;place-items:center;transition:background .12s,color .12s;
}
.icon-btn:hover{background:var(--hover);color:var(--text)}

/* CHAT */
.chat{flex:1;overflow-y:auto;scroll-behavior:smooth}
.chat-inner{max-width:820px;margin:auto;padding:32px 24px 180px}
.welcome{
    min-height:55vh;display:flex;align-items:center;justify-content:center;
    flex-direction:column;text-align:center;
}
.welcome-logo{
    position:relative;
    width:56px;height:56px;border-radius:16px;
    background:linear-gradient(155deg,var(--accent),#2f9885);
    display:grid;place-items:center;color:#04211c;font-family:var(--f-display);font-weight:700;font-size:20px;
    margin-bottom:22px;box-shadow:0 0 0 1px rgba(94,234,212,.25),0 8px 24px -6px var(--accent-glow);
}
.welcome-logo::after{
    content:"";position:absolute;inset:-10px;border-radius:22px;border:1px solid var(--accent);
    opacity:.28;animation:ring 3s cubic-bezier(.4,0,.2,1) infinite;
}
.welcome h1{font-family:var(--f-display);font-size:27px;font-weight:600;margin:0 0 9px;letter-spacing:-.01em}
.welcome p{margin:0;color:var(--muted);font-size:13.5px;font-family:var(--f-mono);letter-spacing:.02em}

.message{display:flex;gap:14px;padding:20px 0;line-height:1.65}
.message.user{justify-content:flex-end}
.message.user .message-row{
    max-width:72%;background:var(--user);border:1px solid var(--user-border);border-radius:var(--r-lg) var(--r-lg) 4px var(--r-lg);
    padding:11px 15px;
}
.message.assistant .message-row{max-width:100%;width:100%}
.avatar{
    width:30px;height:30px;border-radius:var(--r-sm);flex-shrink:0;
    display:grid;place-items:center;font-family:var(--f-display);font-size:11px;font-weight:700;
}
.avatar.user{background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
.avatar.ai{background:linear-gradient(155deg,var(--accent),#2f9885);color:#04211c;box-shadow:0 0 0 1px rgba(94,234,212,.2)}
.message-body{min-width:0;flex:1}
.name{font-size:11.5px;color:var(--muted-dim);margin-bottom:5px;font-family:var(--f-mono);letter-spacing:.03em;text-transform:uppercase}
.content{font-size:14.5px;white-space:pre-wrap;word-wrap:break-word;color:#e4e9ea}
.content code{
    background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:2px 6px;
    font-family:var(--f-mono);font-size:12.5px;color:var(--accent);
}
.code-block{
    background:#0b0f11;border:1px solid var(--border);border-radius:11px;
    overflow:hidden;margin:12px 0;box-shadow:0 4px 16px -8px rgba(0,0,0,.5);
}
.code-head{
    height:36px;padding:0 12px;background:var(--panel2);border-bottom:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;
    font-family:var(--f-mono);letter-spacing:.03em;
}
.copy-code{
    background:var(--panel);color:var(--muted);border:1px solid var(--border);border-radius:6px;
    padding:4px 9px;cursor:pointer;font-size:11px;font-family:var(--f-mono);transition:color .12s,border-color .12s;
}
.copy-code:hover{color:var(--accent);border-color:rgba(94,234,212,.3)}
.code-block pre{margin:0;padding:14px;overflow:auto;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;color:#dbe3e4}
.msg-actions{display:flex;gap:2px;margin-top:9px;opacity:0;transition:opacity .15s}
.message:hover .msg-actions{opacity:1}
.msg-action{
    background:transparent;color:var(--muted-dim);cursor:pointer;border-radius:6px;padding:5px 8px;
    font-size:11.5px;font-family:var(--f-mono);transition:background .12s,color .12s;
}
.msg-action:hover{background:var(--panel2);color:var(--accent)}

.typing{display:flex;gap:3px;align-items:flex-end;height:16px;padding:6px 0}
.typing span{width:3px;height:6px;background:var(--accent);border-radius:2px;animation:wave 1s ease-in-out infinite}
.typing span:nth-child(1){animation-delay:0s}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes wave{0%,60%,100%{height:6px;opacity:.5}30%{height:16px;opacity:1}}

/* COMPOSER */
.composer-wrap{
    position:fixed;left:264px;right:0;bottom:0;padding:14px 24px 22px;
    background:linear-gradient(transparent,var(--bg) 30%);
}
.composer{
    max-width:820px;margin:auto;background:var(--panel2);border:1px solid var(--border);
    border-radius:20px;box-shadow:0 10px 34px -10px rgba(0,0,0,.55);
    transition:border-color .15s,box-shadow .15s;
}
.composer:focus-within{border-color:rgba(94,234,212,.35);box-shadow:0 10px 34px -10px rgba(0,0,0,.55),0 0 0 3px var(--accent-soft)}
.composer.dragging{border-color:var(--accent);outline:1px dashed var(--accent);outline-offset:3px}
.composer-main{display:flex;align-items:flex-end;padding:8px 9px}
#messageInput{
    flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);
    min-height:44px;max-height:180px;padding:11px 9px;font-size:14.5px;line-height:1.5;font-family:var(--f-body);
}
#messageInput::placeholder{color:var(--muted-dim)}
.composer-tools{display:flex;align-items:center;gap:4px}
.tool-btn{
    width:38px;height:38px;border-radius:var(--r-sm);background:transparent;color:var(--muted);
    cursor:pointer;display:grid;place-items:center;transition:background .12s,color .12s;
}
.tool-btn:hover{background:var(--hover);color:var(--accent)}
.send-btn{
    width:38px;height:38px;border-radius:11px;background:var(--accent);color:#04211c;
    cursor:pointer;display:grid;place-items:center;transition:transform .12s,opacity .12s;
}
.send-btn:hover:not(:disabled){transform:translateY(-1px)}
.send-btn:disabled{opacity:.3;cursor:not-allowed}
.hint{text-align:center;color:var(--muted-dim);font-size:10.5px;padding:9px 0 0;font-family:var(--f-mono);letter-spacing:.02em}
#fileInput{display:none}
.attachment{
    margin:9px 13px 0;padding:8px 11px;background:var(--panel);border:1px solid var(--border);
    border-radius:var(--r-sm);font-size:12px;color:var(--muted);display:none;align-items:center;
    font-family:var(--f-mono);
}
.attachment.show{display:flex}
.attachment button{
    margin-left:10px;background:var(--panel2);color:#c7ced2;border:1px solid var(--border);
    border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;transition:border-color .12s;
}
.attachment button:hover{border-color:rgba(240,97,107,.4);color:var(--danger)}

/* MOBILE */
.mobile-menu{display:none}
@media(max-width:800px){
    .sidebar{position:fixed;z-index:50;left:-280px;top:0;bottom:0;transition:left .2s ease;box-shadow:20px 0 40px -20px rgba(0,0,0,.5)}
    .sidebar.open{left:0}
    .mobile-menu{display:grid}
    .composer-wrap{left:0;padding:10px 12px 16px}
    .chat-inner{padding-left:16px;padding-right:16px}
    .message.user .message-row{max-width:88%}
    .topbar{padding:0 12px}
}

@media (prefers-reduced-motion: reduce){
    .brand-icon::after,.welcome-logo::after,.dot::after,.typing span{animation:none}
}

/* SCROLLBAR */
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-thumb{background:#262e33;border-radius:10px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
    <div class="brand">
        <div class="brand-icon">J</div>
        <div class="brand-text">JARVIS<small>Local AI</small></div>
    </div>

    <button class="new-chat" onclick="newChat()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New chat
    </button>

    <div class="sidebar-label">Chats</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">
        <div class="status">
            <span class="dot-wrap"><span class="dot" id="statusDot"></span></span>
            <span id="statusText">Connecting...</span>
        </div>
    </div>
</aside>

<main class="main">
    <header class="topbar">
        <div style="display:flex;align-items:center;gap:6px">
            <button class="icon-btn mobile-menu" onclick="toggleSidebar()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <div class="model-name">JARVIS <small>Local AI</small></div>
        </div>
        <div class="top-actions">
            <button class="icon-btn" title="New chat" onclick="newChat()">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </div>
    </header>

    <section class="chat" id="chat">
        <div class="chat-inner" id="chatInner">
            <div class="welcome" id="welcome">
                <div class="welcome-logo">J</div>
                <h1>How can I help you?</h1>
                <p>Local JARVIS • Ollama • Vision • Files • Tools</p>
            </div>
        </div>
    </section>
</main>

<div class="composer-wrap">
    <div class="composer">
        <div class="attachment" id="attachment"></div>
        <div class="composer-main">
            <button class="tool-btn" title="Attach file" onclick="document.getElementById('fileInput').click()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input id="fileInput" type="file" accept="image/*,.txt,.pdf,.docx,.xlsx,.pptx,.csv,.json">
            <textarea id="messageInput" rows="1" placeholder="Message JARVIS..."></textarea>
            <div class="composer-tools">
                <button class="tool-btn" title="Voice input" onclick="voiceInput()">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
                </button>
                <button class="send-btn" id="sendButton" onclick="sendMessage()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </button>
            </div>
        </div>
    </div>
    <div class="hint">JARVIS can make mistakes. Check important information.</div>
</div>
</div>

<script>
const API_BASE = window.location.origin;
const STORAGE_KEY = "jarvis_chats_v2";

let chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let activeChatId = null;
let selectedFile = null;
let busy = false;

const chat = document.getElementById("chat");
const chatInner = document.getElementById("chatInner");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const chatList = document.getElementById("chatList");
const statusText = document.getElementById("statusText");
const statusDot = document.getElementById("statusDot");
const attachment = document.getElementById("attachment");

function saveChats(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
}

function id(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function currentChat(){
    return chats.find(c => c.id === activeChatId);
}

function newChat(){
    const c = {
        id:id(),
        title:"New chat",
        messages:[],
        created:Date.now()
    };
    chats.unshift(c);
    activeChatId = c.id;
    saveChats();
    renderChatList();
    renderMessages();
    input.focus();
    closeSidebar();
}

function ensureChat(){
    if(!activeChatId || !currentChat()) newChat();
}

function renderChatList(){
    chatList.innerHTML = "";
    chats.forEach(c=>{
        const el = document.createElement("div");
        el.className = "chat-item" + (c.id === activeChatId ? " active":"");
        el.onclick = ()=>loadChat(c.id);
        const icon = document.createElement("span");
        icon.textContent = "◦";
        const title = document.createElement("span");
        title.className = "chat-title";
        title.textContent = c.title || "New chat";
        el.append(icon,title);
        chatList.appendChild(el);
    });
}

function loadChat(chatId){
    activeChatId = chatId;
    renderChatList();
    renderMessages();
    closeSidebar();
}

function renderMessages(){
    chatInner.innerHTML = "";
    const c = currentChat();

    if(!c || !c.messages.length){
        const w = document.createElement("div");
        w.className = "welcome";
        w.innerHTML = `
            <div class="welcome-logo">J</div>
            <h1>How can I help you?</h1>
            <p>Local JARVIS • Ollama • Vision • Files • Tools</p>`;
        chatInner.appendChild(w);
        return;
    }

    c.messages.forEach((m, index)=>addMessageDOM(m.role,m.content,index));
    scrollBottom();
}

function addMessageDOM(role,text,index){
    const wrapper = document.createElement("div");
    wrapper.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar " + (role === "user" ? "user":"ai");
    avatar.textContent = role === "user" ? "U":"J";

    const row = document.createElement("div");
    row.className = "message-row";

    const body = document.createElement("div");
    body.className = "message-body";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = role === "user" ? "You":"JARVIS";

    const content = document.createElement("div");
    content.className = "content";
    content.innerHTML = renderMarkdown(text);

    body.append(name,content);

    if(role === "assistant"){
        const actions = document.createElement("div");
        actions.className = "msg-actions";

        const copy = document.createElement("button");
        copy.className = "msg-action";
        copy.textContent = "Copy";
        copy.onclick = ()=>copyText(text);

        const regen = document.createElement("button");
        regen.className = "msg-action";
        regen.textContent = "Regenerate";
        regen.onclick = ()=>regenerate(index);

        actions.append(copy,regen);
        body.appendChild(actions);
    }

    row.appendChild(body);

    if(role === "user"){
        row.insertBefore(avatar,row.firstChild);
    }else{
        wrapper.appendChild(avatar);
    }

    wrapper.appendChild(row);
    chatInner.appendChild(wrapper);
}

function renderMarkdown(text){
    let s = escapeHtml(String(text ?? ""));

    s = s.replace(/```([a-zA-Z0-9_+-]*)\n([\s\S]*?)```/g,(m,lang,code)=>{
        const safeCode = code.replace(/^\n|\n$/g,"");
        const encoded = encodeURIComponent(safeCode);
        return `<div class="code-block">
            <div class="code-head"><span>${escapeHtml(lang || "code")}</span>
            <button class="copy-code" onclick="copyEncodedCode('${encoded}')">Copy</button></div>
            <pre>${safeCode}</pre>
        </div>`;
    });

    s = s.replace(/`([^`]+)`/g,"<code>$1</code>");
    s = s.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
    s = s.replace(/\*(.*?)\*/g,"<em>$1</em>");
    s = s.replace(/\n/g,"<br>");
    return s;
}

function escapeHtml(str){
    return str.replace(/[&<>"']/g,c=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",
        '"':"&quot;","'":"&#039;"
    }[c]));
}

function addTyping(){
    removeTyping();
    const w = document.createElement("div");
    w.className = "message assistant";
    w.id = "typing";
    w.innerHTML = `
        <div class="avatar ai">J</div>
        <div class="message-row"><div class="message-body">
        <div class="name">JARVIS</div>
        <div class="typing"><span></span><span></span><span></span></div>
        </div></div>`;
    chatInner.appendChild(w);
    scrollBottom();
}

function removeTyping(){
    document.getElementById("typing")?.remove();
}

async function sendMessage(){
    if(busy) return;

    const message = input.value.trim();
    if(!message && !selectedFile) return;

    ensureChat();
    const c = currentChat();

    const displayMessage =
        message +
        (selectedFile ? `\n\n📎 ${selectedFile.name}` : "");

    c.messages.push({
        role:"user",
        content:displayMessage
    });

    if(c.title === "New chat"){
        c.title = message.slice(0,42) || selectedFile?.name || "New chat";
    }

    saveChats();
    renderChatList();
    renderMessages();

    input.value = "";
    autoResize();

    const fileToSend = selectedFile;
    clearAttachment();

    busy = true;
    sendButton.disabled = true;
    addTyping();

    try{
        const form = new FormData();

        form.append("message", message);
        form.append("confirmed", "false");

        if(fileToSend){
            form.append("attachments", fileToSend, fileToSend.name);
        }

        const response = await fetch(`${API_BASE}/api/chat`,{
            method:"POST",
            body:form
        });

        let data;
        try{
            data = await response.json();
        }catch(e){
            throw new Error(`Invalid backend response (${response.status})`);
        }

        removeTyping();

        if(!response.ok || !data.success){
            throw new Error(
                data.error || "Backend request failed."
            );
        }

        c.messages.push({
            role:"assistant",
            content:String(data.reply ?? "")
        });

        saveChats();
        renderMessages();

    }catch(err){
        removeTyping();

        c.messages.push({
            role:"assistant",
            content:"ERROR: " + err.message
        });

        saveChats();
        renderMessages();

        console.error("[JARVIS UI]",err);

    }finally{
        busy = false;
        sendButton.disabled = false;
        input.focus();
    }
}
async function regenerate(index){
    const c = currentChat();

    if(!c || busy || index < 0) return;

    let userIndex = index;

    if(c.messages[userIndex]?.role !== "user"){
        userIndex = -1;

        for(let i=index;i>=0;i--){
            if(c.messages[i].role === "user"){
                userIndex = i;
                break;
            }
        }
    }

    if(userIndex < 0) return;

    const userText = String(c.messages[userIndex].content || "")
        .replace(/\n\n📎 .+$/,"")
        .trim();

    if(!userText) return;

    c.messages = c.messages.slice(0,userIndex);
    saveChats();
    renderMessages();

    input.value = userText;
    autoResize();

    await sendMessage();
}
function copyEncodedCode(encoded){
    try{
        copyText(decodeURIComponent(encoded));
    }catch(e){
        console.error(e);
    }
}

function copyText(text){
    navigator.clipboard?.writeText(text)
        .then(()=>{})
        .catch(()=>{});
}

function scrollBottom(){
    requestAnimationFrame(()=>chat.scrollTop = chat.scrollHeight);
}

function autoResize(){
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight,180) + "px";
}

input.addEventListener("input",autoResize);

input.addEventListener("keydown",e=>{
    if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendMessage();
    }
});

document.getElementById("fileInput").addEventListener("change",e=>{
    showAttachment(e.target.files?.[0] || null);
});

["dragenter","dragover"].forEach(eventName=>{
    document.addEventListener(eventName,e=>{
        if(e.dataTransfer?.types?.includes("Files")){
            e.preventDefault();
            document.querySelector(".composer")?.classList.add("dragging");
        }
    });
});

["dragleave","drop"].forEach(eventName=>{
    document.addEventListener(eventName,e=>{
        if(e.dataTransfer?.types?.includes("Files")){
            e.preventDefault();
            document.querySelector(".composer")?.classList.remove("dragging");
        }
    });
});

document.addEventListener("drop",e=>{
    const files = e.dataTransfer?.files;
    if(!files || !files.length) return;

    const file = files[0];

    if(file.size > 25 * 1024 * 1024){
        alert("File is too large. Maximum size is 25 MB.");
        return;
    }

    showAttachment(file);
});

function showAttachment(file){
    selectedFile = file || null;

    if(selectedFile){
        attachment.innerHTML =
            `<span>📎 ${escapeHtml(selectedFile.name)}</span>
             <button type="button"
                     onclick="clearAttachment()"
                     style="margin-left:10px;background:#333;color:#ddd;border:0;border-radius:6px;padding:3px 7px;cursor:pointer">
                Remove
             </button>`;
        attachment.classList.add("show");
    }else{
        clearAttachment();
    }
}


function clearAttachment(){
    selectedFile = null;
    attachment.textContent = "";
    attachment.classList.remove("show");
    document.getElementById("fileInput").value = "";
}

function voiceInput(){
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SpeechRecognition){
        alert("Voice input is not supported by this browser.");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = e=>{
        input.value = e.results[0][0].transcript;
        autoResize();
        input.focus();
    };
    recognition.onerror = e=>console.error("Speech recognition:",e.error);
    recognition.start();
}

async function checkBackend(){
    try{
        const r = await fetch(`${API_BASE}/api/status`,{cache:"no-store"});
        const data = await r.json();
        const online = !!data.online;
        const vision = data.vision ? " • Vision" : "";
        statusText.textContent = online
            ? `JARVIS Online${vision}`
            : "Backend Offline";
        statusDot.classList.toggle("offline",!online);
    }catch(e){
        statusText.textContent = "Backend Offline";
        statusDot.classList.add("offline");
    }
}

function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("open");
}
function closeSidebar(){
    document.getElementById("sidebar").classList.remove("open");
}

function init(){
    if(chats.length){
        activeChatId = chats[0].id;
    }else{
        newChat();
        return;
    }
    renderChatList();
    renderMessages();
    checkBackend();
    input.focus();
}

init();
setInterval(checkBackend,10000);
</script>
</body>
